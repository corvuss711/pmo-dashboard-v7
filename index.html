<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delhi NCR Clean Air Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800;900&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#F6F6F4; font-family:'Source Sans 3', system-ui, sans-serif; color:#383A3C; }
  a { color:#1D3F86; text-decoration:none; }
  a:hover { color:#12285a; }
  button { font-family:'Source Sans 3', system-ui, sans-serif; }
  [data-card] { transition:border-color .15s ease, box-shadow .15s ease }
  [data-card]:hover { border-color:#1D3F86 !important; box-shadow:0 3px 12px rgba(29,63,134,.12) }
  [data-row]:hover { background:#F1F5FF !important }
  ::-webkit-scrollbar { height:10px; width:10px }
  ::-webkit-scrollbar-thumb { background:#c9c9c4; border-radius:6px }
  @keyframes app-spin { to { transform:rotate(360deg) } }
  .app-spinner { animation:app-spin .7s linear infinite }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
